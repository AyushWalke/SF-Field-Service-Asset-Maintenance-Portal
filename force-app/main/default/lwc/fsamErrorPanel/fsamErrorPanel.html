<template>
    <div class="slds-align_absolute-center slds-p-around_x-large">
        <div class="slds-text-align_center">

            <lightning-icon
                icon-name={iconName}
                size="large"
                alternative-text={title}
                class="error-panel__icon">
            </lightning-icon>

            <h2 class="slds-text-heading_medium slds-m-top_medium">
                {title}
            </h2>

            <p class="slds-text-body_regular slds-text-color_weak slds-m-top_small">
                {message}
            </p>

            <template if:true={hasDetails}>
                <div class="slds-box slds-theme_default slds-m-top_large slds-text-align_left">
                    <p class="slds-text-title_bold slds-m-bottom_x-small">
                        Technical Details
                    </p>

                    <pre class="error-panel__details">{details}</pre>
                </div>
            </template>

        </div>
    </div>
</template>
